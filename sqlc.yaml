version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/adapters/postgres/queries
    gen:
      go:
        package: sqlc
        out: internal/adapters/postgres/sqlc
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        query_parameter_limit: 4
