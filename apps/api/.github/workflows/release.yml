name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: true
      - name: Verify tag and repository
        run: make check-fast public-release
      - name: Build release archives
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            output="micro1-go-template_${GITHUB_REF_NAME}_${os}_${arch}"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -buildid=" -o "dist/$output/api" ./cmd/api
            tar -C "dist/$output" -czf "dist/$output.tar.gz" api
            rm -r "dist/$output"
          done
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
