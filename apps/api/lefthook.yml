min_version: 1.13.6

pre-commit:
  parallel: true
  commands:
    go-format:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    architecture:
      glob: "*.go"
      run: make arch
    fast-tests:
      glob: "*.go"
      run: go test ./...
    public-hygiene:
      run: ./scripts/check-public-release

pre-push:
  commands:
    complete-local-gate:
      run: make check
