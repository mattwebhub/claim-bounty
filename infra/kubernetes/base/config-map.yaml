apiVersion: v1
kind: ConfigMap
metadata:
  name: claimbounty-config
data:
  APP_ENV: production
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: '8080'
  SERVER_READ_HEADER_TIMEOUT: 5s
  SERVER_READ_TIMEOUT: 10m
  SERVER_WRITE_TIMEOUT: 10m
  SERVER_IDLE_TIMEOUT: 1m
  SERVER_SHUTDOWN_TIMEOUT: 30s
  SERVER_READINESS_TIMEOUT: 2s
  HTTP_MAX_HEADER_BYTES: '1048576'
  HTTP_MAX_BODY_BYTES: '263192576'
  HTTP_TRUSTED_PROXY_CIDRS: 192.0.2.0/24
  LOG_LEVEL: info
  LOG_FORMAT: json
  DATABASE_MAX_CONNECTIONS: '10'
  DATABASE_QUERY_TIMEOUT: 5s
  DATABASE_MIGRATION_TIMEOUT: 5m
  DATABASE_AUTO_MIGRATE: 'false'
  CORS_ALLOWED_ORIGINS: https://claimbounty.example.invalid
  CLAIMBOUNTY_ENABLED: 'true'
  CLAIMBOUNTY_CANONICAL_ORIGIN: https://claimbounty.example.invalid
  CLAIMBOUNTY_ROUTINE_REVISION: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  CLAIMBOUNTY_ROUTINE_VALIDATED_AT: '2026-08-30T11:50:00Z'
  CLAIMBOUNTY_ROUTINE_EVIDENCE_SHA256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  CLAIMBOUNTY_AUTHORIZATION_VERSION: admin-policy-v1
  CLAIMBOUNTY_ADMIN_ALLOWLIST_VERSION: admin-allowlist-v1
  CLAIMBOUNTY_S3_ENDPOINT: https://object-storage.example.invalid
  CLAIMBOUNTY_S3_REGION: us-east-1
  CLAIMBOUNTY_S3_BUCKET: claimbounty-private
  CLAIMBOUNTY_S3_SECURE: 'true'
  CLAIMBOUNTY_S3_CREATE_BUCKET: 'false'
  CLAIMBOUNTY_S3_QUARANTINE_PREFIX: quarantine/
  CLAIMBOUNTY_S3_ACCEPTED_PREFIX: accepted/
  CLAIMBOUNTY_S3_EXPORT_PREFIX: exports/
  CLAIMBOUNTY_SMTP_ADDRESS: smtp.example.invalid:587
  CLAIMBOUNTY_SMTP_FROM: no-reply@claimbounty.example.invalid
  CLAIMBOUNTY_SMTP_TLS_MODE: starttls
  CLAIMBOUNTY_SMTP_TLS_SERVER_NAME: smtp.example.invalid
  CLAIMBOUNTY_SMTP_DEVELOPMENT_LOG: 'false'
  CLAIMBOUNTY_CLAMAV_ADDRESS: scanner.example.invalid:3310
  CLAIMBOUNTY_CLAMAV_TIMEOUT: 2m
  CLAIMBOUNTY_WORKER_INTERVAL: 2s
  CLAIMBOUNTY_ABANDONED_AFTER: 168h
  RETENTION_BATCH_SIZE: '25'
  RETENTION_COMMAND_TIMEOUT: 10m
  PII_RETENTION_POLICY_VERSION: intake-30d-v1
  SOURCE_RETENTION_MAX_DURATION: 720h
  PII_RETENTION_MAX_DURATION: 720h
