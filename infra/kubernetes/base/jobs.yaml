apiVersion: batch/v1
kind: Job
metadata:
  name: claimbounty-migrate
  labels:
    app.kubernetes.io/name: claimbounty
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claimbounty
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: claimbounty-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: claimbounty-api:local
          imagePullPolicy: IfNotPresent
          args: [migrate]
          envFrom:
            - configMapRef:
                name: claimbounty-config
            - secretRef:
                name: claimbounty-runtime
            - secretRef:
                name: claimbounty-api-object-storage
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: claimbounty-retention
  labels:
    app.kubernetes.io/name: claimbounty
    app.kubernetes.io/component: retention
spec:
  schedule: '17 3 * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: claimbounty
            app.kubernetes.io/component: retention
        spec:
          restartPolicy: OnFailure
          serviceAccountName: claimbounty-worker
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              image: claimbounty-api:local
              imagePullPolicy: IfNotPresent
              args: [retention]
              envFrom:
                - configMapRef:
                    name: claimbounty-config
                - secretRef:
                    name: claimbounty-runtime
                - secretRef:
                    name: claimbounty-worker-object-storage
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
