apiVersion: apps/v1
kind: Deployment
metadata:
  name: claimbounty-worker
  labels:
    app.kubernetes.io/name: claimbounty
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: claimbounty
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claimbounty
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: claimbounty-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: claimbounty-api:local
          imagePullPolicy: IfNotPresent
          args: [worker]
          envFrom:
            - configMapRef:
                name: claimbounty-config
            - secretRef:
                name: claimbounty-runtime
            - secretRef:
                name: claimbounty-worker-object-storage
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: temp
              mountPath: /tmp
      volumes:
        - name: temp
          emptyDir:
            sizeLimit: 2Gi
