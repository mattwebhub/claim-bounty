---
apiVersion: v1
kind: Service
metadata:
  name: claimbounty-scanner
  labels:
    app.kubernetes.io/name: claimbounty
    app.kubernetes.io/component: scanner
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: claimbounty
    app.kubernetes.io/component: scanner
  ports:
    - name: clamd
      port: 3310
      targetPort: clamd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claimbounty-scanner
  labels:
    app.kubernetes.io/name: claimbounty
    app.kubernetes.io/component: scanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: claimbounty
      app.kubernetes.io/component: scanner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claimbounty
        app.kubernetes.io/component: scanner
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clamd
          image: clamav/clamav-debian:1.4.3@sha256:1d261f9c83ef2bbeef3915c7792f125e5707500fde0019d53547461747b90374
          command: [/init-unprivileged]
          ports:
            - name: clamd
              containerPort: 3310
          startupProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: '2'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: definitions
              mountPath: /var/lib/clamav
            - name: logs
              mountPath: /var/log/clamav
            - name: runtime
              mountPath: /run/clamav
            - name: locks
              mountPath: /run/lock
            - name: temp
              mountPath: /tmp
      volumes:
        - name: definitions
          emptyDir:
            sizeLimit: 2Gi
        - name: logs
          emptyDir:
            sizeLimit: 64Mi
        - name: runtime
          emptyDir:
            sizeLimit: 16Mi
        - name: locks
          emptyDir:
            sizeLimit: 16Mi
        - name: temp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-demo-database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: claimbounty
      app.kubernetes.io/component: database
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [claimbounty]
              - key: app.kubernetes.io/component
                operator: In
                values: [api, migration, retention, worker]
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
