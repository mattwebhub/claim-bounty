    matchLabels:
      app.kubernetes.io/name: claimbounty
      app.kubernetes.io/component: object-storage
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [api, object-storage-init, worker]
      ports:
        - port: 9000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
