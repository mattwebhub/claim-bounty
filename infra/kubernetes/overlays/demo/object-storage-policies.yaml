apiVersion: v1
kind: ConfigMap
metadata:
  name: claimbounty-object-storage-policies
data:
  api-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:PutObject", "s3:DeleteObject", "s3:DeleteObjectVersion"],
          "Resource": ["arn:aws:s3:::claimbounty-private/quarantine/*"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:GetObjectVersion"],
          "Resource": [
            "arn:aws:s3:::claimbounty-private/accepted/*",
            "arn:aws:s3:::claimbounty-private/exports/*"
          ]
        }
      ]
    }
  worker-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:GetObjectVersion", "s3:DeleteObject", "s3:DeleteObjectVersion"],
          "Resource": ["arn:aws:s3:::claimbounty-private/quarantine/*"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:GetObjectVersion", "s3:PutObject", "s3:DeleteObject", "s3:DeleteObjectVersion"],
          "Resource": [
            "arn:aws:s3:::claimbounty-private/accepted/*",
            "arn:aws:s3:::claimbounty-private/exports/*"
          ]
        }
      ]
    }
