name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected applications
    runs-on: ubuntu-latest
    outputs:
      api: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.api }}
      web: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: filter
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'contracts/**'
              - 'infra/**'
              - 'scripts/**'
              - '.github/**'
              - 'Makefile'
              - '.env.example'
            web:
              - 'apps/web/**'
              - 'contracts/**'
              - 'infra/**'
              - 'scripts/**'
              - '.github/**'
              - 'Makefile'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.node-version'
              - '.env.example'

  browser-mocked:
    name: Deterministic browser and accessibility smoke
    if: ${{ needs.changes.outputs.web == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @micro1/web build
      - name: Install Chromium and operating-system dependencies
        run: pnpm --filter @micro1/web exec playwright install --with-deps chromium
      - name: Run deterministic browser tests
        run: pnpm --filter @micro1/web e2e
      - name: Upload mocked-browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: browser-mocked-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  system:
    name: ClaimBounty Compose submission and export system test
    if: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SYSTEM_TEST_REQUIRE_CLAIMBOUNTY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and operating-system dependencies
        run: pnpm --filter @micro1/web exec playwright install --with-deps chromium
      - name: Run required real ClaimBounty system test
        run: make test-system
      - name: Upload system-test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: system-test-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  required:
    name: E2E / Required
    if: ${{ always() }}
    needs: [changes, browser-mocked, system]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all applicable browser gates
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          BROWSER_RESULT: ${{ needs.browser-mocked.result }}
          SYSTEM_RESULT: ${{ needs.system.result }}
        run: |
          set -eu
          [ "$CHANGES_RESULT" = success ]

          if [ "$WEB_CHANGED" = true ]; then
            [ "$BROWSER_RESULT" = success ] || { echo "browser smoke failed or did not run: $BROWSER_RESULT" >&2; exit 1; }
          else
            [ "$BROWSER_RESULT" = skipped ] || [ "$BROWSER_RESULT" = success ]
          fi

          if [ "$API_CHANGED" = true ] || [ "$WEB_CHANGED" = true ]; then
            [ "$SYSTEM_RESULT" = success ] || { echo "system test failed or did not run: $SYSTEM_RESULT" >&2; exit 1; }
          else
            [ "$SYSTEM_RESULT" = skipped ] || [ "$SYSTEM_RESULT" = success ]
          fi

          echo "All applicable E2E gates passed."
