name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected applications
    runs-on: ubuntu-latest
    outputs:
      api: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.api }}
      web: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'contracts/**'
              - 'infra/**'
              - 'scripts/**'
              - '.github/**'
              - 'Makefile'
              - '.env.example'
            web:
              - 'apps/web/**'
              - 'contracts/**'
              - 'infra/**'
              - 'scripts/**'
              - '.github/**'
              - 'Makefile'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.node-version'
              - '.env.example'

  browser-mocked:
    name: Deterministic browser and accessibility smoke
    if: ${{ needs.changes.outputs.web == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @micro1/web build
      - name: Install Chromium and operating-system dependencies
        run: pnpm --filter @micro1/web exec playwright install --with-deps chromium
      - name: Run deterministic browser tests
        run: pnpm --filter @micro1/web e2e
      - name: Upload mocked-browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-mocked-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  system:
    name: Browser to API to PostgreSQL system test
    if: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: app
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      SYSTEM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/app?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/.go-version
          cache: true
          cache-dependency-path: apps/api/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and operating-system dependencies
        run: pnpm --filter @micro1/web exec playwright install --with-deps chromium
      - name: Run real full-stack system test
        run: pnpm test:system
      - name: Upload system-test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-test-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  required:
    name: E2E / Required
    if: ${{ always() }}
    needs: [changes, browser-mocked, system]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all applicable browser gates
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          BROWSER_RESULT: ${{ needs.browser-mocked.result }}
          SYSTEM_RESULT: ${{ needs.system.result }}
        run: |
          set -eu
          [ "$CHANGES_RESULT" = success ]

          if [ "$WEB_CHANGED" = true ]; then
            [ "$BROWSER_RESULT" = success ] || { echo "browser smoke failed or did not run: $BROWSER_RESULT" >&2; exit 1; }
          else
            [ "$BROWSER_RESULT" = skipped ] || [ "$BROWSER_RESULT" = success ]
          fi

          if [ "$API_CHANGED" = true ] || [ "$WEB_CHANGED" = true ]; then
            [ "$SYSTEM_RESULT" = success ] || { echo "system test failed or did not run: $SYSTEM_RESULT" >&2; exit 1; }
          else
            [ "$SYSTEM_RESULT" = skipped ] || [ "$SYSTEM_RESULT" = success ]
          fi

          echo "All applicable E2E gates passed."
