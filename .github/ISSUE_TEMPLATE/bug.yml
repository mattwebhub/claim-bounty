name: Bug report
description: Report a reproducible defect without including secrets or sensitive data.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use private vulnerability reporting instead of this form.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API
        - Web
        - Contract
        - Tooling or CI
        - Full-stack integration
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Observed and expected behavior
      description: What happened, and what should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include deterministic steps and the smallest relevant route or command.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe diagnostic evidence
      description: Remove credentials, personal data, tokens, and private request payloads.
