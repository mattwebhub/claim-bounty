$schema: https://json.schemastore.org/lefthook.json

pre-commit:
  parallel: true
  jobs:
    - name: format staged files
      glob: '*.{css,html,json,md,mjs,ts,tsx,yaml,yml}'
      run: pnpm exec prettier --check -- {staged_files}
    - name: lint staged TypeScript
      glob: '*.{ts,tsx}'
      run: pnpm exec eslint --max-warnings=0 -- {staged_files}

pre-push:
  jobs:
    - name: deterministic verification
      run: pnpm verify:fast
