min_version: 2.1.10

pre-commit:
  parallel: true
  commands:
    contract:
      run: pnpm contract:check
    architecture-registry:
      glob: '{architecture/rules.yaml,docs/rules/*.md,scripts/check-architecture,scripts/explain-rule}'
      run: ./scripts/check-architecture
    go-guardrails:
      glob: 'apps/api/**/*.{go,mod,sum,sql,yaml,yml}'
      run: make api-precommit
    web-fast:
      glob: '{package.json,pnpm-lock.yaml,pnpm-workspace.yaml,apps/web/**/*.{ts,tsx,js,mjs,json,css,html,yaml,yml}}'
      run: make web-check-fast

pre-push:
  commands:
    complete-review:
      run: ./scripts/review --push
      use_stdin: true
